name: auto-pr

on:
  push:
    branches:
      - 'feat/**'
      - 'bug/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    uses: jhouzera/togglemaster-cicd-templates/.github/workflows/auto-pr.yml@f661804cf0718cadc51fff9fe6dad81e63529b43
    with:
      target-branch: develop
